<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Área do Professor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card card-larga">
        <div class="topo">
            <h1>Área do Professor</h1>
            <a href="#" id="btn-sair" class="link-sair">Sair</a>
        </div>

        <p id="aviso" class="aviso" style="display:none"></p>

        <form id="form-nota" class="form-linha">
            <input type="text" id="nome_aluno" placeholder="Nome do aluno" required>
            <input type="number" id="nota_final" placeholder="Nota (0-10)" step="0.1" min="0" max="10" required>
            <button type="submit">Salvar</button>
        </form>

        <table>
            <thead>
                <tr><th>Aluno</th><th>Nota Final</th></tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
        </table>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/professor.js"></script>
</body>
</html>
